# Daily-cadence config: one bar a day, delivery (CNC), positions held across days.
# Differs from config.yaml only where the cadence forces it; see the comments below.
capital: 100000

risk:
  per_trade_pct: 1.0          # max loss per trade as % of capital
  min_risk_fraction: 0.5      # skip a trade margin has shrunk below half its planned risk; 0 disables
  daily_loss_cap_pct: 3.0     # realised + unrealised; stop new entries when breached
  flatten_on_daily_cap: false
  max_entries_per_day: 20     # entry orders only; exits are never blocked
  max_open_positions: 5
  cooldown_bars: 3            # bars to wait on a symbol after a stop-out
  mis_leverage: 5.0           # simulated intraday leverage in backtest/paper
  adopted_stop_pct: 1.5       # fallback stop for orphaned positions (live)

strategy:
  trend_dip:                    # the only setup of six that cleared the swing screen's pre-registered bar
    sma_fast: 20                # 20/50/200 and the 60-bar hold were fixed BEFORE the screen ran.
    sma_mid: 50                 # The grid showed neighbours scoring higher; adopting one now would be
    sma_slow: 200               # curve-fitting and would invalidate the measurement. Do not tune.
    atr_period: 20
    atr_stop_mult: 2.0          # not part of the screen, which was unstopped; see the module docstring
    max_hold_bars: 60           # trading days, the screen's horizon; closed by the broker's time exit
    product: CNC
  ema_rsi:
    fast: 9
    slow: 21
    rsi_period: 14
    rsi_long_min: 55
    rsi_short_max: 45
    atr_period: 14
    atr_stop_mult: 1.5
    reward_risk: 2.0
    min_stop_pct: 0.1         # skip signals whose stop is closer than this % of price
    product: MIS
  confluence:                 # weighted votes from the technical layers; see the indicators spec
    weights: {trend: 1.0, macd: 1.0, momentum: 1.0, breakout: 1.5, pattern: 1.0, exhaustion: -1.5}
    threshold: 3.0            # LONG when the score reaches this, SHORT at minus this
    adx_min: 20               # no trend, no trade
    volume_spike_min: 150     # percent of the 20-bar average a break needs to count
    rsi_overbought: 70
    rsi_oversold: 30
    pct_b_high: 0.8
    pct_b_low: 0.2
    atr_stop_mult: 1.5
    reward_risk: 2.0
    min_stop_pct: 0.1
    product: MIS
  indicators:                 # shared technical set (also feeds the AI filter's context)
    ema_fast: 20
    ema_slow: 50
    levels_period: 100
    pattern_tolerance_pct: 0.3

ai:
  filter: stub                # stub | claude | claude_cached
  model: claude-sonnet-5      # claude-opus-5 for stronger judgment at about 2.5x the price
  candles_in_context: 30
  on_failure: reject          # reject | pass_through
  effort: low                 # classification-style task; raise if reasons look shallow
  max_tokens: 4000            # backstop only; thinking tokens count against it
  timeout_sec: 60
  max_calls_per_run: 10000    # spend guard per backtest; a 62-day replay is at most ~4650 calls
  max_consecutive_failures: 20  # abort the run if the API fails this many bars in a row
  price_in_per_mtok: 2.0      # Sonnet 5 list prices, used only for the report's cost line
  price_out_per_mtok: 10.0
  price_cache_read_per_mtok: 0.2
  price_cache_write_per_mtok: 2.5

execution:
  slippage_pct: 0.05           # percent: 0.05 = 5 bps
  # 3.0, not the intraday 0.1: the buffer is a marketable-limit guard sized for a 5-minute bar.
  # A daily entry fills at the NEXT DAY'S CLOSE, and measured over 2022 on this universe a 0.1%
  # buffer rejected 48.5% of long entries (5,874 of 12,111 close-to-close pairs moved more than
  # 0.1% up) -- ordinary days, not runaways. At 3.0% it rejects 5.0% (601 of 12,111).
  entry_buffer_pct: 3.0
  bar_deadline_sec: 60
  interval_minutes: 1440      # one bar a day; SessionClock switches to daily mode at >= 1440

charges:
  enabled: true
  # Rates come from brokers.yaml, verified 2026-09-22 against groww.in/pricing. Setting any rate
  # here alongside `broker` is refused: with both present the effective rate is not readable from
  # this file, which is how the shipped schedule came to pair Groww's brokerage with Zerodha's DP
  # fee for the whole life of the project.
  broker: groww

regime:                         # longs only while the index is above its EMA, shorts only while at or below
  enabled: false
  source: index                 # index | composite (equal-weight mean of universe returns; needs no index data)
  ema_period: 20                # bars of execution.interval_minutes (days here)

session:                        # unchanged from config.yaml; in daily mode the clock consults
  open: "09:15"                 # only is_trading_day, not this intra-session window
  close: "15:30"
  square_off: "15:10"
  no_new_entries_after: "14:45"
  holidays: []                # ISO dates, e.g. "2026-10-02"

data:
  official_fetch_concurrency: 5
  bar_grace_sec: 5              # paper: wait this long after the boundary before fetching the closed bar
  warmup_bars: 300              # paper: unused here, daily paper trading is not implemented
  index_symbol: NIFTY           # fetched and stored with the universe; feeds the regime filter, never traded

paths:
  db: data/tradebot.db
  logs: data/logs
  instruments: data/instruments.csv
  kill_switch: KILL
  universe: universe.yaml
