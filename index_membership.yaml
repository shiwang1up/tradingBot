# The record of changes is complete from this date, and the claim rests on the sweep rather
# than on the reviews being present. Announcement dates from 2019-11-01 to the anchor were
# swept exhaustively on BOTH NSE hosts -- every ind_prs<DDMMYYYY>{,_1.._3}.pdf -- so no
# unrecorded change can be effective anywhere in the covered span.
#
# The 2019 tail is not decoration. NSE announces off-cycle changes days to weeks ahead, so a
# release announced in late 2019 could take effect in January to mid-March 2020, and such a
# change is usually one-for-one, which means the count invariant would never see it. That
# stretch was swept separately (496 probes; note that niftyindices.com answers 200 with
# Content-Type text/html for files that do not exist -- it does so even for November 31st --
# so only application/pdf counts as a hit). 22 distinct releases exist in November and
# December 2019, 16 of them mirrored on both hosts:
#   * exactly one changes NIFTY 200 -- 2019-12-16, ALBK, ORIENTBANK and TATACHEM out,
#     FORTIS, VBL and WHIRLPOOL in
#     (https://www.niftyindices.com/Press_Release/ind_prs16122019.pdf) -- and it is
#     effective 2019-12-27, BEFORE this date, so it is already reflected in membership on
#     2020-01-01 and correctly has no event here;
#   * four take effect in January 2020 and none of them touches NIFTY 200 (two NIFTY SME
#     EMERGE replacements, two fixed-income reviews);
#   * the rest take effect within 2019.
covers_from: 2020-01-01

# The index holds 200 COMPANIES, and for bounded stretches it carries more SECURITIES than
# that. Two ways that happens, both published, both temporary:
#   * a DVR line trades alongside the ordinary shares of a company that is separately a
#     constituent -- Tata Motors and TATAMTRDVR;
#   * a demerged entity joins at zero price on the record date with nothing leaving, and
#     stays until it lists and is removed.
# Each window below is bounded by events already in this file and cites the release that
# evidences it. Outside them the plain size stands, so an unexplained count is still an
# error -- which is the only reason this mechanism is safe to have.
size_exceptions:

  - from: 2020-01-01
    to: 2020-06-25
    size: 201
    reason: >-
      Tata Motors DVR (TATAMTRDVR) is a second listed security of a company whose ordinary
      shares are separately constituents, so the index carries 201 securities for 200
      companies. Confirmed by this release leaving NIFTY 100, NIFTY 200 and NIFTY
      LargeMidcap 250 one short -- precisely the three indices whose exclusion list
      contains TATAMTRDVR -- while every other fixed-size broad index in it balances.
    source: https://www.niftyindices.com/Press_Release/ind_prs10062020.pdf

  - from: 2023-07-20
    to: 2023-09-06
    size: 201
    reason: >-
      Jio Financial Services (JIOFIN) joined on the Reliance demerger with nothing leaving,
      and was removed on 2023-09-07 for not hitting the price band. The index carried it as
      a 201st security for those seven weeks.
    source: https://www.niftyindices.com/Press_Release/ind_prs17072023.pdf

  - from: 2023-09-29
    to: 2024-08-29
    size: 201
    reason: >-
      Tata Motors DVR (TATAMTRDVR) back in the index, until the DVR was cancelled under the
