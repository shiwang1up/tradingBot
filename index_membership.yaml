# published constituent list) plus every change back to covers_from. src/tradebot/data/
# membership.py replays the changes backward from the anchor to answer any date in between.
#
# Every event cites the NSE Indices press release it was read from. The releases were found
# by an exhaustive sweep of both NSE hosts' press-release namespaces, which located all 14
# semi-annual reviews in the window with no gaps, plus the off-cycle releases.
