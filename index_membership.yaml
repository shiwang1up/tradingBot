# One entity, two symbols. NSE removes an entity under whatever symbol it carries on the
# day, which need not be the one it came in under. Nine of the fourteen pairings below are
# stated outright in the release that excludes the entity; the five plain ticker changes
# are not, because a ticker change is not an index event. The replay is set arithmetic:
# unless both
# symbols are folded to one before it starts, the undo removes a name that is not in the
# set and restores one that is, and the count grows by one for every earlier date.
# Canonicalising to the CURRENT symbol needs no date, so nothing here is inferred beyond
# the identity itself -- and it is also the symbol a broker files the whole price history
# under, so it is what makes those names resolve to candles.
aliases:
  # Demerger placeholders: added at zero price on the record date under a dummy symbol,
  # excluded weeks later under the listed entity's own symbol. Each of these pairings is
  # STATED in the release that excludes it -- "NSE Indices Limited vide its press release
  # dated December 30, 2024 had announced inclusion of ITC Hotels Ltd. with a dummy symbol
  # DUMMYITC", and the same sentence pattern for the other four. Both releases of each
  # pair are cited on the events below.
  DUMMYITC: ITCHOTELS          # ITC Hotels Ltd.
  DUMMYSIEMS: ENRIN            # Siemens Energy India Ltd.
  DUMMYABFRL: ABLBL            # Aditya Birla Lifestyle Brands Ltd.
  DUMMYTATAM: TMCV             # TML Commercial Vehicles Ltd. / Tata Motors Ltd.
  DUMMYHDLVR: KWIL             # Kwality Wall's (India) Ltd.
  # Ticker changes with no index event of their own. THESE FIVE ARE THE UNSOURCED ONES:
  # a ticker change is not an index change, so no release in the corpus states them. Each
  # was included under the old symbol, never excluded under it, and the new symbol sits in
  # today's anchor, which is what identifies the pair. (The nine above are all stated.)
  ADANITRANS: ADANIENSOL       # Adani Transmission -> Adani Energy Solutions
  ADANIGAS: ATGL               # Adani Gas -> Adani Total Gas
  NIITTECH: COFORGE            # NIIT Technologies -> Coforge
  ZOMATO: ETERNAL              # Zomato -> Eternal
  GMRINFRA: GMRAIRPORT         # GMR Airports Infrastructure -> GMR Airports
  # The Vedanta four-way demerger. All four mappings are STATED IN THE SOURCES. Each of
  # the three June 2026 exclusion releases opens with the same sentence, which pairs the
  # entities to the dummy symbols in order:
  #
  #   "NSE Indices Limited vide its press release dated April 23, 2026 had announced
  #    inclusion of Vedanta Aluminium Metal Ltd. (VAML), Vedanta Power Ltd. (VEDPOWER),
  #    Vedanta Oil and Gas Ltd. (VOGL) and Vedanta Iron and Steel Ltd. (VISL) with dummy
  #    symbols DUMMYVEDL1, DUMMYVEDL2, DUMMYVEDL3 and DUMMYVEDL4 respectively, on account
  #    of demerger of Aluminium, Merchant Power, Oil and Gas and Iron Ore businesses from
  #    Vedanta Ltd."
  #
  # -- https://www.niftyindices.com/Press_Release/ind_prs17062026.pdf
  #    https://www.niftyindices.com/Press_Release/ind_prs19062026.pdf
  #    https://www.niftyindices.com/Press_Release/ind_prs22062026.pdf
  #    (the same preamble in all three, quoted here from the first)
  #
  # "respectively" is what does the work, and the business list repeats the order a second
  # time. Note that the entities were RENAMED between the April inclusion and the June
  # exclusions -- DUMMYVEDL2 is Talwandi Sabo Power Ltd. in April and Vedanta Power Ltd. in
  # June, DUMMYVEDL3 is Malco Energy Ltd. then Vedanta Oil and Gas Ltd. -- so the April
  # release alone does not settle the pairing and these three do.
  DUMMYVEDL1: VAML             # Vedanta Aluminium Metal Ltd. (Aluminium)
  DUMMYVEDL2: VEDPOWER         # Vedanta Power Ltd., formerly Talwandi Sabo Power Ltd. (Merchant Power)
  DUMMYVEDL3: VOGL             # Vedanta Oil and Gas Ltd., formerly Malco Energy Ltd. (Oil and Gas)
  DUMMYVEDL4: VISL             # Vedanta Iron and Steel Ltd. (Iron Ore)

# Every NSE release effective on or after covers_from that changes NIFTY 200, newest first.
# One event per release: a release is the unit of evidence, so two releases effective on the
# same date stay two events -- 2024-03-28 is the one such pair here. constituents_on undoes
# a whole date at once, so the state between them is never checked; it never existed.
#
# Releases effective AFTER the anchor date are deliberately absent: the anchor already
# reflects only what has happened by anchor.as_of, so replaying a later change backward from
# it would corrupt every query. The 2026-H2 review (announced 2026-08-10, effective
# 2026-09-30, 7 out / 7 in, https://www.niftyindices.com/Press_Release/ind_prs10082026.pdf)
# is the one release in the corpus that this excludes. load_timeline rejects such an event.
#
# "Inclusion revoked" / "Exclusion revoked" wording is an AMENDMENT to an earlier release,
# not a change of its own. Both such releases in this window are resolved by editing the
# review they cite; see the comments on 2024-03-28 and 2024-09-30.
#
# DUMMY* symbols are real constituents: a demerged entity is added at zero price on the
# record date under a placeholder symbol and removed days or weeks later under its real
# symbol once it lists. They are recorded because the index genuinely held them.
events:

  - effective: 2026-06-24
    source: https://www.niftyindices.com/Press_Release/ind_prs22062026.pdf
    include: []
    exclude: [VOGL]
    # Vedanta Oil and Gas Ltd. did not hit the lower price band on two consecutive days.
    # Listed sibling of the DUMMYVEDL* placeholders added 2026-04-30.

  - effective: 2026-06-23
    source: https://www.niftyindices.com/Press_Release/ind_prs19062026.pdf
    include: []
    exclude: [VAML]
    # Vedanta Aluminium Metal Ltd.

  - effective: 2026-06-19
    source: https://www.niftyindices.com/Press_Release/ind_prs17062026.pdf
    include: []
    exclude: [VEDPOWER, VISL]
    # Vedanta Power Ltd. and Vedanta Iron and Steel Ltd.

  - effective: 2026-04-30
    source: https://www.niftyindices.com/Press_Release/ind_prs23042026.pdf
    include: [DUMMYVEDL1, DUMMYVEDL2, DUMMYVEDL3, DUMMYVEDL4]
    exclude: []
    # Four-way demerger of Vedanta Ltd.: Vedanta Aluminium Metal Ltd. (DUMMYVEDL1),
    # Talwandi Sabo Power Ltd. (DUMMYVEDL2), Malco Energy Ltd. (DUMMYVEDL3) and Vedanta
    # Iron and Steel Ltd. (DUMMYVEDL4), all at zero price without divisor adjustment.
    # They leave under their listed symbols (VAML, VEDPOWER, VISL, VOGL) in June 2026;
    # which dummy became which listed symbol is not stated by any release, so no rename
    # is recorded. Only DUMMYVEDL1 -> VAML and DUMMYVEDL4 -> VISL are certain by name.

  - effective: 2026-03-30
    source: https://www.niftyindices.com/Press_Release/ind_prs23022026.pdf
    include: [GROWW, GVT&D, ICICIAMC, LAURUSLABS, LENSKART, LGEINDIA, MCX, RADICO,
              TATACAP, TATAINVEST, TMCV]
