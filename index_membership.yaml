# No renames are recorded. The DUMMY* placeholders each leave under a different, real
# symbol (DUMMYITC -> ITCHOTELS, DUMMYSIEMS -> ENRIN, DUMMYABFRL -> ABLBL, DUMMYTATAM ->
# TMCV, DUMMYHDLVR -> KWIL, and the four DUMMYVEDL* -> VAML / VEDPOWER / VISL / VOGL), and
# those identities are real -- but no NSE release states the mapping as a symbol change,
# the DUMMYVEDL* mapping is not derivable at all for two of the four, and a rename here is
# applied after the backward replay rather than during it, so it would relabel names in
# periods where neither symbol was a member. The identities are recorded in the comments on
# the events above instead.
